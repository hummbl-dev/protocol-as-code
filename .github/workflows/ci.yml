name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # Lightweight validation — works on any repo regardless of language
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          # Basic secret pattern scan
          if grep -rE '(ghp_[0-9a-zA-Z]{36}|sk-[0-9a-zA-Z]{48}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            --include='*.py' --include='*.js' --include='*.ts' --include='*.sh' \
            --include='*.yml' --include='*.yaml' --include='*.json' --include='*.toml' \
            --include='*.env' --include='*.cfg' --include='*.conf' \
            . 2>/dev/null; then
            echo "::error::Potential secrets detected in tracked files"
            exit 1
          fi

      - name: Check for common issues
        run: |
          # Check no-large-files (>1MB)
          find . -type f -size +1M -not -path './.git/*' -not -path './node_modules/*' | while read f; do
            echo "::warning file=$f::Large file detected (>1MB)"
          done

          # Check for merge conflict markers
          if grep -rE '^(<<<<<<<|=======|>>>>>>>)' . --include='*.py' --include='*.js' --include='*.ts' --include='*.md' 2>/dev/null; then
            echo "::error::Merge conflict markers detected"
            exit 1
          fi

  # Python tests (only if Python files exist)
  python-tests:
    runs-on: ubuntu-latest
    if: hashFiles('**/*.py') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests if pytest available
        run: |
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            pip install pytest --quiet
            pip install -e . --quiet 2>/dev/null || pip install -r requirements.txt --quiet 2>/dev/null || true
            pytest --tb=short 2>&1 || echo "::warning::Tests failed or no tests found"
          fi

  # Node tests (only if JS/TS files exist)
  node-tests:
    runs-on: ubuntu-latest
    if: hashFiles('**/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests if available
        run: |
          if [ -f package.json ]; then
            npm ci --quiet 2>/dev/null || npm install --quiet 2>/dev/null || true
            npm test 2>&1 || echo "::warning::Tests failed or no test script"
          fi
